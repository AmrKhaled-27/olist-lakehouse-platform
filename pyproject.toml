[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-lakehouse-platform"
version = "0.1.0"
description = "End-to-End Modern Lakehouse Platform for Olist E-Commerce Analytics using PySpark, MinIO, DuckDB, dbt, and Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0,<3.6.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "minio>=7.2.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
    "duckdb>=1.1.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "kaggle>=1.6.0",
    "tqdm>=4.66.0",
    "streamlit>=1.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --verbose"
testpaths = [
    "tests",
]
pythonpath = ["."]
