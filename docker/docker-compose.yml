services:
  # -------------------------------------------------------------------------
  # MinIO Object Storage (Lakehouse Storage Engine)
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: olist-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse-net

  # -------------------------------------------------------------------------
  # MinIO Initialization (Auto-creates bronze, silver, gold buckets)
  # -------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-07-31T15-58-33Z
    container_name: olist-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_BRONZE:-bronze};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_SILVER:-silver};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_GOLD:-gold};
      echo 'MinIO Buckets initialized successfully:';
      /usr/bin/mc ls myminio;
      exit 0;
      "
    networks:
      - lakehouse-net

  # -------------------------------------------------------------------------
  # Apache Spark Master
  # -------------------------------------------------------------------------
  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: olist-spark-master
    hostname: spark-master
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master RPC port
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
    volumes:
      - ../src:/app/src
      - ../configs:/app/configs
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - lakehouse-net

  # -------------------------------------------------------------------------
  # Apache Spark Worker
  # -------------------------------------------------------------------------
  spark-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: olist-spark-worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Spark Worker Web UI
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
    volumes:
      - ../src:/app/src
      - ../configs:/app/configs
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - lakehouse-net

  # -------------------------------------------------------------------------
  # dbt + DuckDB Analytics Runner
  # -------------------------------------------------------------------------
  dbt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dbt
    container_name: olist-dbt-runner
    volumes:
      - ../dbt_olist:/usr/app/dbt
      - ../configs:/usr/app/configs
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
    networks:
      - lakehouse-net
    profiles:
      - cli

networks:
  lakehouse-net:
    driver: bridge

volumes:
  minio_data:
    driver: local
