services:
  # -------------------------------------------------------------------------
  # MinIO Object Storage (Lakehouse Storage Engine)
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: olist-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse-net

  # -------------------------------------------------------------------------
  # MinIO Initialization (Auto-creates bronze, silver, gold buckets)
  # -------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-07-31T15-58-33Z
    container_name: olist-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_BRONZE:-bronze};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_SILVER:-silver};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_GOLD:-gold};
      echo 'MinIO Buckets initialized successfully:';
      /usr/bin/mc ls myminio;
      exit 0;
      "
    networks:
      - lakehouse-net

  # -------------------------------------------------------------------------
  # Apache Spark Master
  # -------------------------------------------------------------------------
  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: olist-spark-master
    hostname: spark-master
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master RPC port
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
    volumes:
      - ../src:/app/src
      - ../configs:/app/configs
      - ../data:/app/data
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - lakehouse-net

  # -------------------------------------------------------------------------
  # Apache Spark Worker
  # -------------------------------------------------------------------------
  spark-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: olist-spark-worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Spark Worker Web UI
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
    volumes:
      - ../src:/app/src
      - ../configs:/app/configs
      - ../data:/app/data
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - lakehouse-net

  # -------------------------------------------------------------------------
  # dbt + DuckDB Analytics Runner
  # -------------------------------------------------------------------------
  dbt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dbt
    container_name: olist-dbt-runner
    volumes:
      - ../dbt_olist:/usr/app/dbt
      - ../configs:/usr/app/configs
      - ../data:/usr/app/data
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      - MINIO_S3_ENDPOINT=minio:9000
    networks:
      - lakehouse-net
    profiles:
      - cli

  # -------------------------------------------------------------------------
  # Streamlit BI Analytics Dashboard
  # -------------------------------------------------------------------------
  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: olist-streamlit-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../src/dashboard:/app/src/dashboard
      - ../data:/app/data
    environment:
      - DUCKDB_PATH=/app/data/gold_lakehouse.duckdb
    networks:
      - lakehouse-net
    depends_on:
      - minio

  # -------------------------------------------------------------------------
  # Apache Airflow Metadata Database (PostgreSQL)
  # -------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:15-alpine
    container_name: olist-airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - airflow

  # -------------------------------------------------------------------------
  # Apache Airflow Init (DB migration & Admin user)
  # -------------------------------------------------------------------------
  airflow-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: olist-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - _AIRFLOW_WWW_USER_ROLE=Admin
      - _AIRFLOW_WWW_USER_EMAIL=admin@example.com
    networks:
      - lakehouse-net
    command: version
    profiles:
      - airflow

  # -------------------------------------------------------------------------
  # Apache Airflow Webserver (UI on Port 8085)
  # -------------------------------------------------------------------------
  airflow-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: olist-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=olist_lakehouse_secret_key_2026
      - PYTHONPATH=/workspace:/opt/airflow
      - MINIO_ENDPOINT=${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_BUCKET_BRONZE=${MINIO_BUCKET_BRONZE:-bronze}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
    volumes:
      - ../dags:/opt/airflow/dags
      - ../logs:/opt/airflow/logs
      - ../src:/opt/airflow/src
      - ../configs:/opt/airflow/configs
      - ../data:/opt/airflow/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace
    working_dir: /workspace
    user: "0:0"
    networks:
      - lakehouse-net
    command: webserver
    profiles:
      - airflow

  # -------------------------------------------------------------------------
  # Apache Airflow Scheduler
  # -------------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: olist-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=olist_lakehouse_secret_key_2026
      - PYTHONPATH=/workspace:/opt/airflow
      - MINIO_ENDPOINT=${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_BUCKET_BRONZE=${MINIO_BUCKET_BRONZE:-bronze}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
    volumes:
      - ../dags:/opt/airflow/dags
      - ../logs:/opt/airflow/logs
      - ../src:/opt/airflow/src
      - ../configs:/opt/airflow/configs
      - ../data:/opt/airflow/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace
    working_dir: /workspace
    user: "0:0"
    networks:
      - lakehouse-net
    command: scheduler
    profiles:
      - airflow

networks:
  lakehouse-net:
    driver: bridge

volumes:
  minio_data:
    driver: local
  airflow_postgres_data:
    driver: local
